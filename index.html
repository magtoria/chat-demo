<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Candelaria la inmobiliaria</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
      text-align: center;
    }

    header {
      background: #0f172a;
      color: white;
      padding: 40px 20px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 10px;
      font-size: 16px;
      opacity: 0.95;
    }

    .container {
      padding: 40px 20px;
    }

    .chat-box {
      max-width: 1000px;
      margin: auto;
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    .chat-frame-wrap {
      width: 100%;
      height: 80vh;
      min-height: 700px;
      border-radius: 16px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    @media (max-width: 768px) {
      .container {
        padding: 20px 12px;
      }

      .chat-box {
        padding: 12px;
        border-radius: 12px;
      }

      .chat-frame-wrap {
        height: 78vh;
        min-height: 620px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Encuentra tu vivienda ideal</h1>
    <p>Habla con Candelaria, tu asistente inmobiliaria, y recibe opciones personalizadas</p>
  </header>

  <div class="container">
    <div class="chat-box">
      <div class="chat-frame-wrap">
        <iframe
          src="https://app.relevanceai.com/agents/d7b62b/b9330aed-becf-4dd3-afcb-44608f1f0d2f/92c4455c-2094-425a-8504-03d593031230/embed-chat?hide_tool_steps=false&hide_file_uploads=false&hide_conversation_list=false&bubble_style=agent&primary_color=%23685FFF&bubble_icon=pd%2Fchat&input_placeholder_text=Type+your+message...&hide_logo=false&hide_description=false"
          frameborder="0"
          allow="microphone"
          title="Candelaria la inmobiliaria"
        ></iframe>
      </div>
    </div>
  </div>

</body>
</html>
